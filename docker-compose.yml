# SST Alumni Connect — Docker Compose
#
#   cp .env.example .env            (optional — every value has a safe default)
#   docker compose up -d --build    first start generates passwords and keys automatically
#   docker compose logs api         shows the one-time setup code; then open http://localhost:8080
#
# Infrastructure passwords (database, Redis, MinIO, Flower) are generated by the `init-secrets`
# service into a private volume. Application settings — institution, branding, SMTP/SMS/storage
# credentials, security policy, modules — are configured in the web interface.
#
# Scale the stateless services independently:
#   docker compose up -d --scale api=3 --scale realtime=3
# Optional profiles:  dev (mailpit mail catcher)   ops (flower queue monitor)

name: sst-alumni

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-backend: &backend
  build:
    context: .
    dockerfile: docker/backend/Dockerfile
  image: sst-alumni/backend:latest
  restart: unless-stopped
  logging: *logging
  environment: &backend-env
    ENVIRONMENT: ${ENVIRONMENT:-production}
    MINIO_ENDPOINT: minio:9000
    MINIO_PUBLIC_URL: /s3
    TRUSTED_PROXIES: "1"
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
    DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
  volumes:
    - app_config:/app/config
    - storage:/app/storage
    - infra_secrets:/run/infra:ro
  networks: [edge, data]
  depends_on:
    init-secrets: { condition: service_completed_successfully }
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  init-secrets:
    # One-shot: generates infrastructure passwords into the private infra_secrets volume.
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    image: sst-alumni/backend:latest
    entrypoint: ["sh", "/app/init-secrets.sh"]
    user: "0:0"
    volumes:
      - infra_secrets:/run/infra
    network_mode: none
    logging: *logging

  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: alumni
      POSTGRES_USER: alumni
      POSTGRES_PASSWORD_FILE: /run/infra/postgres_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-300}", "-c", "shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}",
              "-c", "log_min_duration_statement=500"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - infra_secrets:/run/infra:ro
    depends_on:
      init-secrets: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alumni -d alumni"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [data]
    deploy: { resources: { limits: { memory: 2g } } }
    logging: *logging

  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --requirepass \"$$(cat /run/infra/redis_password)\" --appendonly yes --maxmemory-policy noeviction"]
    volumes:
      - redisdata:/data
      - infra_secrets:/run/infra:ro
    depends_on:
      init-secrets: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/infra/redis_password)\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [data]
    deploy: { resources: { limits: { memory: 512m } } }
    logging: *logging

  minio:
    image: elestio/minio:latest
    restart: unless-stopped
    entrypoint: ["sh", "-c", "MINIO_ROOT_USER=$$(cat /run/infra/minio_user) MINIO_ROOT_PASSWORD=$$(cat /run/infra/minio_password) exec minio server /data --console-address :9001"]
    volumes:
      - miniodata:/data
      - infra_secrets:/run/infra:ro
    depends_on:
      init-secrets: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [data]
    deploy: { resources: { limits: { memory: 1g } } }
    logging: *logging

  api:
    <<: *backend
    command: ["api"]
    environment:
      <<: *backend-env
      API_WORKERS: ${API_WORKERS:-4}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health/ready"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 6
    deploy: { resources: { limits: { memory: 1g } } }

  realtime:
    <<: *backend
    command: ["realtime"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/realtime/health"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    deploy: { resources: { limits: { memory: 512m } } }

  celery-worker:
    <<: *backend
    command: ["worker"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker:celery_app inspect ping --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 5
    deploy: { resources: { limits: { memory: 768m } } }

  celery-beat:
    <<: *backend
    command: ["beat"]
    depends_on:
      api: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 256m } } }

  nginx:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: nginx
    image: sst-alumni/nginx:latest
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - storage:/srv/storage:ro
    networks: [edge, data]
    deploy: { resources: { limits: { memory: 256m } } }
    logging: *logging

  flower:
    <<: *backend
    command: ["flower"]
    profiles: ["ops"]
    depends_on:
      init-secrets: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 256m } } }

  mailpit:
    image: axllent/mailpit:v1.21.8
    profiles: ["dev"]
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    networks: [edge]
    logging: *logging

networks:
  edge: {}
  data:
    internal: true   # database, cache and object storage are not reachable from outside

volumes:
  pgdata:         # PostgreSQL data
  redisdata:      # Redis append-only file (queues)
  miniodata:      # object storage
  storage:        # local file storage (uploads when the provider is "local")
  app_config:     # generated application keys + first-run setup code
  infra_secrets:  # generated infrastructure passwords
