[project]
name = "sst-alumni-connect"
version = "0.1.0"
description = "SST Alumni Connect — API, real-time gateway and background workers"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "gunicorn==23.0.0",
  "pydantic==2.10.3",
  "pydantic-settings==2.7.0",
  "email-validator==2.2.0",
  "sqlalchemy[asyncio]==2.0.36",
  "asyncpg==0.30.0",
  "psycopg[binary]==3.2.3",
  "alembic==1.14.0",
  "redis==5.2.1",
  "python-socketio==5.11.4",
  "celery[redis]==5.4.0",
  "kombu==5.4.2",  # celery 5.4 transport; 5.7+ needs redis-py 6
  "flower==2.0.1",
  "argon2-cffi==23.1.0",
  "pyjwt==2.10.1",
  "pyotp==2.9.0",
  "cryptography==44.0.0",
  "python-multipart==0.0.20",
  "httpx==0.28.1",
  "prometheus-client==0.21.1",
  "orjson==3.10.12",
  "minio==7.2.12",
  "pillow==11.0.0",
  "filetype==1.2.0",
]

[dependency-groups]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
  "fakeredis==2.26.2",
  "ruff==0.8.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]

[tool.uv]
package = false

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]  # environment must be set before the app is imported
"app/services/templates.py" = ["E501"]  # HTML email bodies
"alembic/versions/*" = ["E501"]  # generated DDL
"app/services/exports.py" = ["E501"]  # OOXML namespace strings
"app/modules/cms/seed.py" = ["E501"]  # starter copy
"app/modules/community/*.py" = ["E501"]  # long query chains
