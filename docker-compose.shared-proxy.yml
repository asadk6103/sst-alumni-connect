# SST Alumni Connect — behind the shared HTTPS proxy (several SST applications on one server).
#
# Use this instead of docker-compose.letsencrypt.yml when another application on the same server
# (e.g. the SST Platform website) also needs ports 80/443. One Caddy container ("sst-edge" project,
# created by the installers) owns 80/443, gets a Let's Encrypt certificate for every domain and
# forwards each domain to its application's nginx over the shared Docker network "sst-edge".
#
# Enabled by:  ./install/install-docker.sh --shared-proxy --domain alumni.example.pk --email it@example.pk
# which writes COMPOSE_FILE=docker-compose.yml:docker-compose.shared-proxy.yml (+ prod) to .env
# and registers the domain with the shared proxy. Needs Docker Compose 2.24 or newer.

services:
  nginx:
    # Reachable from the shared proxy as "sst-alumni-nginx"; the loopback port stays for `make health`.
    ports: !override
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    networks:
      edge: {}
      data: {}
      sst-edge:
        aliases: [sst-alumni-nginx]

  # Two proxies (shared Caddy → nginx) sit in front of the backend: needed for correct client IPs.
  api:
    environment:
      TRUSTED_PROXIES: "2"
  realtime:
    environment:
      TRUSTED_PROXIES: "2"

networks:
  sst-edge:
    external: true
    name: sst-edge
