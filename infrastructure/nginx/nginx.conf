# SST Alumni Connect — single public entry point
#   /api/          REST API              (service api,      scalable)
#   /realtime/     Socket.IO gateway     (service realtime, scalable, WebSocket)
#   /media/        uploaded files        (local storage volume, else streamed by the API)
#   /s3/           bundled object storage (public objects only)
#   /login /register /setup /portal /admin …       portal & administration single-page app
#   /              public website        (service frontend)
#
# Upstream names are resolved through Docker DNS at request time, so replicas added with
# `docker compose up --scale api=3 --scale realtime=3` are used without restarting nginx.

worker_processes auto;
worker_rlimit_nofile 65535;
events { worker_connections 8192; multi_accept on; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on; tcp_nopush on; tcp_nodelay on;
  server_tokens off;
  keepalive_timeout 65;
  client_max_body_size 101m;   # the API enforces the configured upload limit (max 100 MB)

  gzip on; gzip_comp_level 5; gzip_min_length 1024; gzip_vary on;
  gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml application/xml;

  log_format main '$remote_addr "$request" $status $body_bytes_sent rt=$request_time urt=$upstream_response_time "$http_user_agent"';
  access_log /var/log/nginx/access.log main buffer=32k flush=5s;

  resolver 127.0.0.11 valid=10s ipv6=off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  # Keep the original scheme when an HTTPS proxy sits in front.
  map $http_x_forwarded_proto $forwarded_proto { default $http_x_forwarded_proto; '' $scheme; }

  # Brute-force protection in front of the API's own limits.
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=api:20m rate=50r/s;
  limit_req_status 429;

  server {
    listen 80;
    server_name _;

    set $api       api:8000;
    set $realtime  realtime:8000;
    set $web       frontend:3000;
    set $minio     minio:9000;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    error_page 502 503 504 /__unavailable.html;
    location = /__unavailable.html { root /usr/share/nginx/html; internal; }

    # Prometheus metrics stay inside the Docker network.
    location = /metrics { return 404; }

    location /api/v1/auth/ {
      limit_req zone=auth burst=20 nodelay;
      proxy_pass http://$api;
    }
    location /api/ {
      limit_req zone=api burst=100 nodelay;
      proxy_pass http://$api;
      proxy_read_timeout 120s;
    }

    location /realtime/ {
      proxy_pass http://$realtime;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }

    location /media/ {
      root /srv/storage/public;
      rewrite ^/media/(.*)$ /$1 break;
      try_files $uri @media_api;
      expires 30d;
      add_header Cache-Control "public, immutable" always;
      add_header X-Content-Type-Options nosniff always;
    }
    location @media_api { proxy_pass http://$api; }

    location /s3/ {
      # Only objects under <bucket>/public/ are readable (bucket policy set by the API).
      rewrite ^/s3/(.*)$ /$1 break;
      proxy_pass http://$minio;
      proxy_set_header Host minio:9000;
      proxy_hide_header Set-Cookie;
      expires 30d;
      add_header Cache-Control "public" always;
      limit_except GET HEAD { deny all; }
    }

    location /flower/ {
      set $flower flower:5555;
      proxy_pass http://$flower;
    }

    # Single-page app (portal, administration, sign-in, setup)
    location /spa-assets/ {
      root /usr/share/nginx/app;
      expires 1y;
      add_header Cache-Control "public, immutable" always;
      try_files $uri =404;
    }
    location ~ ^/(login|register|forgot-password|reset-password|verify-email|setup|portal|admin)(/|$) {
      root /usr/share/nginx/app;
      try_files /index.html =404;
      add_header Cache-Control "no-cache" always;
      add_header X-Frame-Options DENY always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' ws: wss:; frame-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    }

    location / {
      proxy_pass http://$web;
    }
  }
}
