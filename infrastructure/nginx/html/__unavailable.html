<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="15">
<title>Starting up — SST Alumni Connect</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F7F8FC;font-family:Inter,Segoe UI,Arial,sans-serif;color:#20283A}
  .card{max-width:420px;margin:24px;padding:32px;background:#fff;border:1px solid #E6E8F0;border-radius:12px;text-align:center}
  .dot{width:36px;height:36px;margin:0 auto 18px;border-radius:50%;border:3px solid #F2ECFF;border-top-color:#7138DB;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  h1{font-size:18px;margin:0 0 6px} p{margin:0;color:#718096;font-size:14px;line-height:1.5}
</style>
</head>
<body>
  <div class="card">
    <div class="dot" aria-hidden="true"></div>
    <h1>SST Alumni Connect is starting</h1>
    <p>The service will be ready shortly. This page refreshes automatically.</p>
  </div>
</body>
</html>
